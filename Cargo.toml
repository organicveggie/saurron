[package]
name = "saurron"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[features]
web = ["dep:sqlx", "dep:include_dir"]

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
cron = "0.17"
futures = "0.3"
bollard = { version = "0.20", features = ["ssl"] }
clap = { version = "4", features = ["derive", "env"] }
config = { version = "0.15", default-features = false, features = ["toml"] }
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "builder", "smtp-transport", "ring"] }
minijinja = "2"
prometheus = "0.14"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "query"] }
rumqttc-next = "0.33.2"
rustls-native-certs = "0.8"
rustls-pemfile = "2"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
thiserror = "2"
sqlx = { version = "0.9", features = ["sqlite", "runtime-tokio", "macros", "migrate"], optional = true }
include_dir = { version = "0.7", optional = true }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-logfmt = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
proptest = "1"
testcontainers = "0.27"
