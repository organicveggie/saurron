name: Update Sample Config

on:
  push:
    branches: ["main"]
    paths:
      - "src/cli.rs"
      - "src/config.rs"
    tags: ["v*"]

permissions:
  contents: write
  actions: write

# Serialize runs so that concurrent pushes don't produce conflicting commits.
# cancel-in-progress: false keeps the queued run; the latest source wins.
concurrency:
  group: sample-config
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build binary
        run: cargo build --locked

      # Tag pushes leave the checkout in a detached HEAD state. Switch to main
      # so the regenerated file is committed there. The binary in target/ is
      # unaffected by the branch switch.
      - name: Switch to main for commit
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git checkout main
          git pull origin main

      - name: Write sample-config.md
        run: |
          {
            printf '%s\n' '---'
            printf '%s\n' 'layout: page'
            printf '%s\n' 'title: Sample Config'
            printf '%s\n' '---'
            printf '\n'
            printf '%s\n' '<!-- prettier-ignore-start -->'
            printf '%s\n' '# Sample Config'
            printf '%s\n' '{: .no_toc }'
            printf '\n'
            printf '%s\n' '<!-- prettier-ignore-end -->'
            printf '\n'
            printf '%s\n' 'Generated by `saurron --generate-config`. Shows all available options with their defaults.'
            printf '\n'
            printf '```toml\n'
            ./target/debug/saurron --generate-config
            printf '```\n'
          } > docs/collections/_reference/sample-config.md

      - name: Commit if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/collections/_reference/sample-config.md
          if git diff --staged --quiet; then
            echo "No changes to sample-config.md"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "docs: regenerate sample config"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Jekyll deployment
        if: steps.commit.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'jekyll.yml',
              ref: 'main'
            })
