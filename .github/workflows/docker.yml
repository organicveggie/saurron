name: Docker

on:
  push:
    branches: ["main"]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    strategy:
      matrix:
        release: [bookworm, bullseye, trixie]
        variant: [slim, full]
        platform: [linux/amd64, linux/arm64]

    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}

    steps:
      - uses: actions/checkout@v4

      - name: Display Runner Info
        run: |
          echo "Running on: ${{ matrix.platform }}"
          echo "Dockerfile: docker/${{ matrix.release }}/${{ matrix.variant }}/Dockerfile"
          uname -m

      # Artifact names cannot contain slashes, so convert linux/amd64 → linux-amd64.
      - name: Prepare platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      # Push by digest only (no tag yet) so each platform image lands in the
      # registry without polluting the tag namespace before the manifest merge.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.release }}/${{ matrix.variant }}/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: SAURRON_BUILD_VERSION=${{ github.ref_name }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.release }}-${{ matrix.variant }}-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ matrix.release }}-${{ matrix.variant }}-${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.release }}-${{ matrix.variant }}-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  binary-build:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --profile release --locked
        env:
          SAURRON_BUILD_VERSION: ${{ github.ref_name }}
      - name: Package tarball
        run: |
          tar -czf saurron-${{ github.ref_name }}-linux-${{ matrix.arch }}.tar.gz \
            -C target/release saurron
      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: tarball-linux-${{ matrix.arch }}
          path: saurron-${{ github.ref_name }}-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        release: [bookworm, bullseye, trixie]
        variant: [slim, full]

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.release }}-${{ matrix.variant }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          RELEASE="${{ matrix.release }}"
          VARIANT="${{ matrix.variant }}"

          if [ "$VARIANT" = "full" ]; then
            SUFFIX="-${RELEASE}"
          else
            SUFFIX="-slim-${RELEASE}"
          fi

          ARGS=""
          PRIMARY=""

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            MAJOR=$(echo "$VERSION" | cut -d. -f1)
            MINOR=$(echo "$VERSION" | cut -d. -f2)
            MAJOR_MINOR="${MAJOR}.${MINOR}"

            # Full version tag for all combinations, including pre-releases.
            ARGS+=" -t ${IMAGE}:${VERSION}${SUFFIX}"

            # Major.minor and major tags only for stable releases.
            if [[ "$VERSION" != *-* ]]; then
              ARGS+=" -t ${IMAGE}:${MAJOR_MINOR}${SUFFIX}"
              ARGS+=" -t ${IMAGE}:${MAJOR}${SUFFIX}"

              # (trixie, full) is the canonical image: also gets bare semver + latest.
              if [ "$RELEASE" = "trixie" ] && [ "$VARIANT" = "full" ]; then
                ARGS+=" -t ${IMAGE}:${VERSION}"
                ARGS+=" -t ${IMAGE}:${MAJOR_MINOR}"
                ARGS+=" -t ${IMAGE}:${MAJOR}"
                ARGS+=" -t ${IMAGE}:latest"
              fi

              # (trixie, slim) gets slim-prefixed semver + slim.
              if [ "$RELEASE" = "trixie" ] && [ "$VARIANT" = "slim" ]; then
                ARGS+=" -t ${IMAGE}:slim-${VERSION}"
                ARGS+=" -t ${IMAGE}:slim-${MAJOR_MINOR}"
                ARGS+=" -t ${IMAGE}:slim-${MAJOR}"
                ARGS+=" -t ${IMAGE}:slim"
              fi
            fi

            PRIMARY="${IMAGE}:${VERSION}${SUFFIX}"
          fi

          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            ARGS+=" -t ${IMAGE}:edge${SUFFIX}"

            # (trixie, full) also gets the bare edge tag; (trixie, slim) gets edge-slim.
            if [ "$RELEASE" = "trixie" ]; then
              if [ "$VARIANT" = "full" ]; then
                ARGS+=" -t ${IMAGE}:edge"
              else
                ARGS+=" -t ${IMAGE}:edge-slim"
              fi
            fi

            PRIMARY="${IMAGE}:edge${SUFFIX}"
          fi

          echo "args=${ARGS}" >> $GITHUB_OUTPUT
          echo "primary=${PRIMARY}" >> $GITHUB_OUTPUT

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            ${{ steps.tags.outputs.args }} \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect manifest
        run: |
          docker buildx imagetools inspect ${{ steps.tags.outputs.primary }}

  release:
    runs-on: ubuntu-latest
    needs: [merge, binary-build]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download tarballs
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          pattern: tarball-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: ./artifacts/*
